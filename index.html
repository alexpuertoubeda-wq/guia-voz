<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paso Firme</title>
<meta name="description" content="Guía por voz para personas ciegas: avisa de obstáculos con la cámara y dice dónde estás.">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1220; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #cam, #ov { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #cam { opacity: .55; }
  main { position: fixed; inset: 0; display: flex; flex-direction: column; }
  button { flex: 1; border: 0; margin: 0; font: inherit; font-size: 2.2rem; font-weight: 700;
    color: #fff; background: rgba(11,18,32,.45); touch-action: manipulation; }
  #btnGuide { border-bottom: 4px solid #ffd60a; }
  #btnGuide[aria-pressed="true"] { background: rgba(190,30,45,.45); }
  button:active { background: rgba(255,214,10,.35); }
  button:focus-visible { outline: 6px solid #ffd60a; outline-offset: -6px; }
  #diag { position: fixed; left: 0; right: 0; top: 0; margin: 0; padding: .3rem .6rem; font-size: .9rem;
    background: rgba(0,0,0,.7); pointer-events: none; text-align: center; }
  #status { position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    margin: 0; padding: .6rem 1rem; text-align: center; font-size: 1.15rem;
    background: rgba(0,0,0,.75); pointer-events: none; min-height: 2.6rem; }
</style>
</head>
<body>
<video id="cam" playsinline muted aria-hidden="true"></video>
<canvas id="ov" aria-hidden="true"></canvas>
<main>
  <button id="btnGuide" aria-pressed="false">Iniciar guía</button>
  <button id="btnTalk">Dar una orden por voz</button>
</main>
<p id="diag" aria-hidden="true"></p>
<p id="status" aria-hidden="true">Paso Firme. Arriba: iniciar guía. Abajo: dar una orden.</p>

<script src="tf.min.js"></script>
<script src="coco-ssd.min.js"></script>
<script>
'use strict';

// ---------- Datos ----------
// Objetos que se anuncian: nombre en español y altura real aproximada en metros,
// usada para estimar la distancia a partir del tamaño en la imagen.
const OBJ = {
  'person': ['persona', 1.7], 'bicycle': ['bicicleta', 1.0], 'car': ['coche', 1.5],
  'motorcycle': ['moto', 1.1], 'bus': ['autobús', 3.0], 'truck': ['camión', 3.0],
  'train': ['tren', 3.5], 'traffic light': ['semáforo', 0.9],
  'fire hydrant': ['boca de riego', 0.7], 'stop sign': ['señal de stop', 0.75],
  'parking meter': ['parquímetro', 1.3], 'bench': ['banco', 0.85], 'dog': ['perro', 0.5],
  'cat': ['gato', 0.3], 'chair': ['silla', 0.9], 'couch': ['sofá', 0.85],
  'potted plant': ['maceta', 0.6], 'bed': ['cama', 0.6], 'dining table': ['mesa', 0.75],
  'toilet': ['inodoro', 0.75], 'tv': ['televisor', 0.6], 'refrigerator': ['frigorífico', 1.7],
  'suitcase': ['maleta', 0.65], 'backpack': ['mochila', 0.5], 'umbrella': ['paraguas', 0.9]
};
const NEAR = 1.5;      // metros: aviso urgente
const SIDE_BLOCK = 3;  // metros: un lado se considera ocupado
const FAR = 8;         // metros: más lejos no se anuncia

// ---------- Estado ----------
const video = document.getElementById('cam');
const canvas = document.getElementById('ov');
const ctx = canvas.getContext('2d');
const btnGuide = document.getElementById('btnGuide');
const btnTalk = document.getElementById('btnTalk');
const statusEl = document.getElementById('status');
const diagEl = document.getElementById('diag');
let model = null, stream = null, running = false, starting = false, listening = false;
let wakeLock = null, lastSaid = '', lastUrgent = 0, lastSummary = 0, lastClear = 0;
let seen = [];           // últimas detecciones procesadas
let modelBase = 'mobilenet_v2'; // el más preciso; si va lento se cambia al ligero
let slowFrames = 0, switching = false;
const MIN_SCORE = 0.3;
// Medidor de profundidad: detecta cualquier cosa cercana (paredes, puertas, muebles), tenga o no nombre.
const TRANSFORMERS_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2';
const DEPTH_MODEL = 'onnx-community/depth-anything-v2-small';
let depthT = null, depthPipe = null, depthLoading = false, depthLooping = false;
let depth = { state: 'off', C: 0, L: 0, R: 0, B: 0, ts: 0, ms: 0 };
let stopped = false, lastWarn = 0, wc = null, wctx = null, lc = null, lctx = null;
let locatedOnce = false;

// ---------- Voz ----------
// mode: 'urgent' corta lo que se esté diciendo; 'queue' espera su turno;
// 'skip' no dice nada si ya se está hablando.
function say(text, mode) {
  const synth = window.speechSynthesis;
  statusEl.textContent = text;
  if (!synth) return false;
  if (mode === 'urgent') synth.cancel();
  else if (mode === 'skip' && (synth.speaking || synth.pending)) return false;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES';
  u.rate = 1.1;
  synth.speak(u);
  lastSaid = text;
  return true;
}
function buzz(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); }

function metros(d) {
  if (d < 1) return 'a menos de un metro';
  const n = Math.round(d);
  return n === 1 ? 'a un metro' : 'a ' + n + ' metros';
}
const ZONE_TXT = { izq: 'a la izquierda', cen: 'delante', der: 'a la derecha' };

// ---------- Cálculo (funciones puras, se prueban aparte) ----------
function estimateDistance(cls, bbox, vw, vh) {
  const h = bbox[3], y = bbox[1];
  const vfov = (vh >= vw ? 65 : 50) * Math.PI / 180; // campo de visión vertical supuesto
  const focal = (vh / 2) / Math.tan(vfov / 2);
  // Si el objeto llena la imagen de arriba abajo, está encima.
  if (y <= vh * 0.02 && y + h >= vh * 0.98) return 0.8;
  const d = OBJ[cls][1] * focal / h;
  // Un objeto que ocupa casi media imagen está cerca aunque se vea cortado.
  if (bbox[2] * h >= vw * vh * 0.45) return Math.min(d, 1);
  return d;
}
function zoneOf(bbox, vw) {
  const cx = (bbox[0] + bbox[2] / 2) / vw;
  return cx < 0.33 ? 'izq' : cx > 0.67 ? 'der' : 'cen';
}
function process(preds, vw, vh) {
  return preds.filter(p => OBJ[p.class]).map(p => ({
    name: OBJ[p.class][0],
    kind: p.class,
    zone: zoneOf(p.bbox, vw),
    dist: estimateDistance(p.class, p.bbox, vw, vh),
    bbox: p.bbox
  })).filter(o => o.dist <= FAR).sort((a, b) => a.dist - b.dist);
}
// Analiza el mapa de profundidad relativa (valor alto = cerca). Devuelve el estado del camino.
// C, L, R y B son la cercanía (0 lejos, 1 lo más cercano de la imagen) del centro, los lados y el suelo.
function analyzeDepth(d, W, H) {
  // Referencia de "lo más cercano de la imagen": percentil 95. Lo demás se mide como proporción de ella.
  // En profundidad inversa, una proporción de 0,7 equivale a estar 1,4 veces más lejos que lo más cercano.
  const all = [];
  for (let i = 0; i < d.length; i += 7) all.push(d[i]);
  all.sort((m, n) => m - n);
  const lo = all[Math.floor(all.length * 0.05)], near = all[Math.floor(all.length * 0.95)];
  // Imagen sin relieve: lo normal es tener una superficie pegada a la cámara. Ante la duda, bloqueado.
  if (!(near > 0) || (near - lo) / near < 0.12) return { state: 'blocked', flat: true, C: 1, L: 1, R: 1, B: 1 };
  const pct = (x0, x1, y0, y1, q) => {
    const a = [];
    for (let y = Math.floor(y0 * H); y < Math.floor(y1 * H); y += 3)
      for (let x = Math.floor(x0 * W); x < Math.floor(x1 * W); x += 3) a.push(Math.max(0, d[y * W + x]) / near);
    a.sort((m, n) => m - n);
    return a.length ? Math.min(1, a[Math.min(a.length - 1, Math.floor(a.length * q))]) : 0;
  };
  const B = pct(0.25, 0.75, 0.88, 1, 0.5);
  const C = pct(0.33, 0.67, 0.3, 0.62, 0.75);
  const L = pct(0, 0.33, 0.3, 0.62, 0.6);
  const R = pct(0.67, 1, 0.3, 0.62, 0.6);
  let state = 'free';
  if (C >= 0.72) state = 'blocked';
  else if (B < 0.45) state = 'nofloor';
  else if (C >= 0.52) state = 'warn';
  return { state, C, L, R, B };
}
function depthAdvice(dp) {
  const l = dp.L < 0.5, r = dp.R < 0.5;
  if (l && r) return dp.L <= dp.R ? 'Hay más espacio a la izquierda.' : 'Hay más espacio a la derecha.';
  if (l) return 'Gira a la izquierda.';
  if (r) return 'Gira a la derecha.';
  return 'No hay paso libre. Gira despacio sobre ti mismo hasta que te avise.';
}
// Color dominante de un semáforo a partir de sus píxeles (RGBA).
function lightColor(px) {
  let red = 0, green = 0, amber = 0;
  const n = px.length / 4;
  for (let i = 0; i < px.length; i += 4) {
    const r = px[i], g = px[i + 1], b = px[i + 2];
    if (r > 170 && g > 110 && b < 110 && r > g * 1.1 && g > b * 1.4) amber++;
    else if (r > 150 && r > g * 1.6 && r > b * 1.6) red++;
    else if (g > 140 && g > r * 1.4 && g >= b * 0.9) green++;
  }
  const top = Math.max(red, green, amber);
  if (top < n * 0.03) return null;
  return top === red ? 'rojo' : top === green ? 'verde' : 'ámbar';
}
function lightLabel(color) {
  if (color === 'rojo') return 'semáforo en rojo';
  if (color === 'ámbar') return 'semáforo en ámbar';
  if (color === 'verde') return 'semáforo en verde, confirma antes de cruzar';
  return 'semáforo, no distingo el color';
}
function advice(objs) {
  const blocked = z => objs.some(o => o.zone === z && o.dist < SIDE_BLOCK);
  if (!blocked('izq')) return 'Pasa por la izquierda.';
  if (!blocked('der')) return 'Pasa por la derecha.';
  return 'Detente.';
}
function pathText(st) {
  return st === 'free' ? 'El camino de delante parece libre.' : st === 'warn' ? 'Hay algo cerca delante.' :
    st === 'blocked' ? 'El paso de delante está cortado.' : st === 'off' ? 'El detector de paredes no está listo.' : 'No veo bien el camino.';
}
function describeText(objs) {
  if (!objs.length) return 'No detecto ningún objeto conocido.';
  return objs.slice(0, 4).map(o => o.name + ' ' + ZONE_TXT[o.zone] + ', ' + metros(o.dist)).join('. ') + '.';
}

// ---------- Guía ----------
function depthState() {
  if (!depthPipe) return 'off';
  if (Date.now() - depth.ts > 6000) return 'doubt';
  return depth.state;
}
// Regla de seguridad: ante la duda, primero parar y después dar la instrucción.
function decide(objs, dp, dstate) {
  const danger = objs.find(o => o.zone === 'cen' && o.dist < NEAR);
  if (danger) return { stop: true, text: 'Para. ' + danger.name + ' delante, ' + metros(danger.dist) + '. ' + advice(objs) };
  if (dstate === 'blocked') return { stop: true, text: 'Para. Obstáculo delante, muy cerca. ' + depthAdvice(dp) };
  if (dstate === 'doubt') return { stop: true, text: 'Para. No veo bien el camino. Espera sin avanzar.' };
  if (dstate === 'nofloor') return { stop: true, text: 'Para. No veo el suelo. Inclina el móvil un poco hacia abajo.' };
  if (dstate === 'warn') return { stop: false, warn: true, text: 'Atención, algo cerca delante. Avanza despacio.' };
  return { stop: false };
}
function announce(objs) {
  if (listening) return;
  const now = Date.now();
  const dec = decide(objs, depth, depthState());
  if (dec.stop) {
    if (now - lastUrgent > 3500) {
      lastUrgent = now; lastSummary = now;
      buzz([250, 100, 250]);
      say(dec.text, 'urgent');
    }
    stopped = true;
    return;
  }
  if (stopped) {
    stopped = false; lastSummary = now;
    say(dec.warn ? 'Hay algo de espacio. Avanza muy despacio.' : 'Camino libre. Puedes seguir despacio.', 'urgent');
    return;
  }
  if (dec.warn && now - lastWarn > 4000) {
    if (say(dec.text, 'skip')) { lastWarn = now; lastSummary = now; }
    return;
  }
  if (objs.length) {
    if (now - lastSummary > 4000) {
      const text = objs.slice(0, 2).map(o => o.name + ' ' + ZONE_TXT[o.zone] + ', ' + metros(o.dist)).join('. ') + '.';
      if (say(text, 'skip')) lastSummary = now;
    }
  } else if (now - lastClear > 12000 && now - lastSummary > 4000) {
    if (say(depthPipe ? 'Camino libre.' : 'Sin objetos detectados. El detector de paredes aún no está listo.', 'skip')) lastClear = now;
  }
}

// ---------- Profundidad ----------
async function loadDepth() {
  if (depthPipe || depthLoading) { if (depthPipe) depthLoop(); return; }
  depthLoading = true;
  try {
    const T = await import(TRANSFORMERS_URL);
    const p = await T.pipeline('depth-estimation', DEPTH_MODEL, { device: 'wasm', dtype: 'q8' });
    p.processor.image_processor.size = { height: 154, width: 154 };
    depthT = T; depthPipe = p; depth.ts = Date.now();
    say('Detector de paredes y obstáculos listo.', 'queue');
    depthLoop();
  } catch (e) {
    console.error(e);
    say('No he podido cargar el detector de paredes. Solo reconoceré objetos conocidos.', 'queue');
  } finally { depthLoading = false; }
}
async function depthLoop() {
  if (depthLooping) return;
  depthLooping = true;
  if (!wc) { wc = document.createElement('canvas'); wctx = wc.getContext('2d', { willReadFrequently: true }); }
  depth.ts = Date.now();
  while (running && depthPipe) {
    if (video.readyState >= 2 && video.videoWidth) {
      try {
        const vw = video.videoWidth, vh = video.videoHeight, s = 160 / Math.max(vw, vh);
        wc.width = Math.round(vw * s); wc.height = Math.round(vh * s);
        wctx.drawImage(video, 0, 0, wc.width, wc.height);
        const t0 = performance.now();
        const out = await depthPipe(depthT.RawImage.fromCanvas(wc));
        const pd = out.predicted_depth, dims = pd.dims;
        const a = analyzeDepth(pd.data, dims[dims.length - 1], dims[dims.length - 2]);
        depth = Object.assign(a, { ts: Date.now(), ms: Math.round(performance.now() - t0) });
      } catch (e) { console.error(e); }
    }
    await new Promise(r => setTimeout(r, 120));
  }
  depthLooping = false;
}
// Lee el color de cada semáforo detectado.
function readLights(objs) {
  for (const o of objs) {
    if (o.kind !== 'traffic light') continue;
    try {
      if (!lc) { lc = document.createElement('canvas'); lc.width = 24; lc.height = 48; lctx = lc.getContext('2d', { willReadFrequently: true }); }
      const [x, y, w, h] = o.bbox;
      lctx.drawImage(video, x, y, w, h, 0, 0, 24, 48);
      o.name = lightLabel(lightColor(lctx.getImageData(0, 0, 24, 48).data));
    } catch (e) { o.name = lightLabel(null); }
  }
}

function draw(objs) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (canvas.width !== vw || canvas.height !== vh) { canvas.width = vw; canvas.height = vh; }
  ctx.clearRect(0, 0, vw, vh);
  ctx.lineWidth = Math.max(3, vw / 160);
  ctx.font = 'bold ' + Math.max(16, vw / 28) + 'px system-ui, sans-serif';
  for (const o of objs) {
    const [x, y, w, h] = o.bbox;
    ctx.strokeStyle = ctx.fillStyle = o.dist < NEAR ? '#ff453a' : '#ffd60a';
    ctx.strokeRect(x, y, w, h);
    ctx.fillText(o.name + ' ' + o.dist.toFixed(1) + ' m', x + 6, Math.max(y - 8, 24));
  }
}

async function loop() {
  while (running) {
    if (video.readyState >= 2 && video.videoWidth) {
      try {
        const t0 = performance.now();
        const preds = await model.detect(video, 20, MIN_SCORE);
        const ms = Math.round(performance.now() - t0);
        if (!running) break;
        seen = process(preds, video.videoWidth, video.videoHeight);
        readLights(seen);
        draw(seen);
        diagEl.textContent = seen.length + (seen.length === 1 ? ' objeto' : ' objetos') + ' · ' + ms + ' ms · ' +
          (modelBase === 'mobilenet_v2' ? 'preciso' : 'ligero') +
          (depthPipe ? ' · prof ' + depth.state + ' C' + depth.C.toFixed(2) + ' I' + depth.L.toFixed(2) + ' D' + depth.R.toFixed(2) +
            ' S' + depth.B.toFixed(2) + ' ' + depth.ms + ' ms' : ' · prof cargando');
        announce(seen);
        // Si cada imagen tarda más de 1,5 s, el aviso llegaría tarde: se pasa al modelo ligero.
        if (modelBase === 'mobilenet_v2' && !switching) {
          slowFrames = ms > 1500 ? slowFrames + 1 : 0;
          if (slowFrames >= 4) {
            switching = true;
            try { const lite = await cocoSsd.load({ base: 'lite_mobilenet_v2' }); model = lite; modelBase = 'lite_mobilenet_v2'; }
            catch (e) { console.error(e); }
            switching = false; slowFrames = 0;
          }
        }
      } catch (e) { console.error(e); }
    }
    await new Promise(r => setTimeout(r, 300));
  }
}

async function start() {
  if (running || starting) return;
  starting = true;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('Este navegador no permite usar la cámara.', 'urgent'); return;
    }
    say('Preparando la guía. Espera.', 'urgent');
    // La cámara se pide primero, mientras el toque del usuario sigue siendo reciente.
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    if (!model) {
      try { model = await cocoSsd.load({ base: modelBase }); }
      catch (e) { modelBase = 'lite_mobilenet_v2'; model = await cocoSsd.load({ base: modelBase }); }
    }
    try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    running = true;
    btnGuide.setAttribute('aria-pressed', 'true');
    btnGuide.textContent = 'Parar guía';
    buzz(80);
    say('Guía activada. Lleva el móvil a la altura del pecho, con la cámara hacia delante. ' +
        'Usa siempre tu bastón o tu perro guía: no detecto escalones, bordillos, baches ni pasos de peatones. Si digo para, detente.', 'urgent');
    if (!locatedOnce) { locatedOnce = true; whereAmI(); }
    loop();
    loadDepth();
  } catch (e) {
    console.error(e);
    stopCamera();
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    say(denied ? 'No tengo permiso para usar la cámara. Actívalo en los ajustes del navegador.'
               : 'No he podido iniciar la guía. Comprueba la conexión y vuelve a intentarlo.', 'urgent');
  } finally { starting = false; }
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}
function stop() {
  if (!running) { say('La guía ya está parada.', 'urgent'); return; }
  running = false;
  seen = [];
  stopped = false;
  stopCamera();
  btnGuide.setAttribute('aria-pressed', 'false');
  btnGuide.textContent = 'Iniciar guía';
  buzz(80);
  say('Guía parada.', 'urgent');
}

// ---------- Ubicación ----------
async function whereAmI() {
  if (!navigator.geolocation) { say('Este móvil no ofrece ubicación.', 'queue'); return; }
  say('Buscando tu ubicación.', 'queue');
  try {
    const pos = await new Promise((ok, ko) => navigator.geolocation.getCurrentPosition(ok, ko,
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 }));
    const c = pos.coords;
    const url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1' +
      '&accept-language=es&lat=' + c.latitude + '&lon=' + c.longitude;
    const r = await fetch(url);
    if (!r.ok) throw new Error('geocoder ' + r.status);
    say(placeText(await r.json(), c.accuracy), 'queue');
  } catch (e) {
    console.error(e);
    say(e && e.code === 1 ? 'No tengo permiso para usar la ubicación.'
                          : 'No he podido averiguar dónde estás.', 'queue');
  }
}
function placeText(j, accuracy) {
  const a = (j && j.address) || {};
  const street = a.road || a.pedestrian || a.footway || a.path || a.square;
  const town = a.city || a.town || a.village || a.municipality;
  let t;
  if (street) t = 'Estás en ' + street + (a.house_number ? ', número ' + a.house_number : '');
  else if (town) t = 'No encuentro el nombre de la calle. Estás';
  else return 'No encuentro el nombre de este lugar.';
  if (town) t += (street ? ', ' : ' en ') + town;
  t += '.';
  if (accuracy) t += ' Precisión aproximada: ' + Math.round(accuracy) + ' metros.';
  return t;
}

// ---------- Órdenes por voz ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen() {
  if (!SR) { say('Este navegador no admite órdenes por voz. Usa Chrome.', 'urgent'); return; }
  if (listening) return;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  const rec = new SR();
  rec.lang = 'es-ES';
  rec.maxAlternatives = 3;
  rec.interimResults = false;
  let got = false;
  rec.onresult = e => {
    got = true;
    const alts = [];
    for (let i = 0; i < e.results[0].length; i++) alts.push(e.results[0][i].transcript);
    handle(alts.join(' | '));
  };
  rec.onerror = e => {
    got = true;
    say(e.error === 'not-allowed' || e.error === 'service-not-allowed'
      ? 'No tengo permiso para usar el micrófono.' : 'No te he oído. Pulsa abajo y repite la orden.', 'urgent');
  };
  rec.onend = () => { listening = false; if (!got) say('No te he oído. Pulsa abajo y repite la orden.', 'urgent'); };
  listening = true;
  buzz(60);
  statusEl.textContent = 'Escuchando…';
  try { rec.start(); } catch (e) { listening = false; }
}
function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function command(text) {
  const t = ' ' + norm(text).replace(/[^a-z0-9| ]/g, ' ').replace(/\s+/g, ' ') + ' ';
  const has = (...w) => w.some(x => t.includes(' ' + x + ' ') || (x.includes(' ') && t.includes(x)));
  if (has('donde estoy', 'ubicacion', 'calle', 'donde me encuentro')) return 'where';
  if (has('para', 'parar', 'parate', 'detente', 'deten', 'stop', 'termina', 'apaga')) return 'stop';
  if (has('que hay', 'describe', 'que ves', 'que tengo delante')) return 'describe';
  if (has('empieza', 'inicia', 'iniciar', 'comienza', 'vamos', 'guiame', 'activa', 'guia')) return 'start';
  if (has('repite', 'otra vez', 'repetir')) return 'repeat';
  if (has('ayuda', 'ordenes', 'instrucciones')) return 'help';
  return null;
}
function handle(text) {
  switch (command(text)) {
    case 'where': whereAmI(); break;
    case 'stop': stop(); break;
    case 'describe': say(running ? describeText(seen) + ' ' + pathText(depthState()) : 'Inicia primero la guía para que pueda ver.', 'urgent'); break;
    case 'start': running ? say('La guía ya está activada.', 'urgent') : start(); break;
    case 'repeat': say(lastSaid || 'Todavía no he dicho nada.', 'urgent'); break;
    case 'help': help(); break;
    default: say('No he entendido la orden. Di ayuda para oír las órdenes.', 'urgent');
  }
}
function help() {
  say('Mitad superior de la pantalla: iniciar o parar la guía. Mitad inferior: dar una orden. ' +
      'Órdenes: inicia la guía, para, dónde estoy, qué hay delante, repite y ayuda.', 'urgent');
}

// ---------- Arranque ----------
if (typeof document !== 'undefined' && btnGuide) {
  btnGuide.addEventListener('click', () => running ? stop() : start());
  btnTalk.addEventListener('click', listen);
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && running && navigator.wakeLock && !wakeLock) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    } else if (document.visibilityState === 'hidden') { wakeLock = null; }
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    // El service worker añade las cabeceras que permiten al medidor de profundidad usar varios núcleos.
    // Hace falta recargar una vez para que surtan efecto.
    const reloadOnce = () => {
      try {
        if (!self.crossOriginIsolated && !sessionStorage.getItem('pf-coi')) { sessionStorage.setItem('pf-coi', '1'); location.reload(); }
      } catch (e) {}
    };
    if (navigator.serviceWorker.controller) reloadOnce();
    else navigator.serviceWorker.addEventListener('controllerchange', reloadOnce);
  }
  // Arranque sin tocar la pantalla: si el permiso de cámara ya se concedió en un uso
  // anterior, la guía empieza sola al abrir la app (por ejemplo, con "Ok Google, abre Paso Firme").
  window.addEventListener('load', async () => {
    try {
      const p = await navigator.permissions.query({ name: 'camera' });
      if (p.state === 'granted') start();
    } catch (e) {}
  });
}
</script>
